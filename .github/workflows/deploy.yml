name: Deploy SmartQueue

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartqueue-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME }}
      AWS_APPLICATION_NAME: ${{ vars.AWS_APPLICATION_NAME }}
      ALERTS_EMAIL: ${{ vars.ALERTS_EMAIL }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Deployment is restricted to main. Select the main branch for workflow_dispatch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          python -m pip install --disable-pip-version-check PyYAML

      - name: Validate repository configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def intrinsic(loader, suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node, deep=True)
              else:
                  value = loader.construct_mapping(node, deep=True)
              return {"Ref": value} if suffix == "Ref" else {f"Fn::{suffix}": value}

          CloudFormationLoader.add_multi_constructor("!", intrinsic)
          for workflow in (Path(".github/workflows/ci.yml"), Path(".github/workflows/deploy.yml")):
              assert yaml.safe_load(workflow.read_text(encoding="utf-8")), f"Invalid workflow: {workflow}"
          template = yaml.load(
              Path("infrastructure/template.yaml").read_text(encoding="utf-8"),
              Loader=CloudFormationLoader,
          )
          assert template["Transform"] == "AWS::Serverless-2016-10-31"
          for manifest, lockfile in (
              (Path("package.json"), Path("package-lock.json")),
              (Path("backend/package.json"), Path("backend/package-lock.json")),
          ):
              package = json.loads(manifest.read_text(encoding="utf-8"))
              lock = json.loads(lockfile.read_text(encoding="utf-8"))
              assert lock["packages"][""]["dependencies"] == package.get("dependencies", {})
              assert lock["packages"][""]["devDependencies"] == package.get("devDependencies", {})
          PY

      - name: Check backend syntax and tests
        run: |
          node --check backend/src/index.mjs
          node --check backend/src/worker.mjs
          node --check backend/src/reminders.mjs
          npm run test:backend

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate SAM template
        run: sam validate --lint --template-file infrastructure/template.yaml

      - name: Build SAM application
        run: sam build --template-file infrastructure/template.yaml

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN AWS_STACK_NAME AWS_APPLICATION_NAME; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the GitHub Actions variable ${name}."
              exit 1
            fi
          done

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: SmartQueueGitHubActions

      - name: Deploy SAM stack
        shell: bash
        run: |
          parameters=(
            "ApplicationName=${AWS_APPLICATION_NAME}"
            "StageName=prod"
          )
          if [[ -n "${ALERTS_EMAIL}" ]]; then
            parameters+=("AlertsEmail=${ALERTS_EMAIL}")
          fi
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${AWS_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "${parameters[@]}"

      - name: Read deployed CloudFormation outputs
        id: stack
        shell: bash
        run: |
          output() {
            aws cloudformation describe-stacks \
              --stack-name "${AWS_STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          api_url="$(output ApiUrl)"
          user_pool_id="$(output UserPoolId)"
          user_pool_client_id="$(output UserPoolClientId)"
          frontend_bucket="$(output FrontendBucketName)"
          frontend_url="$(output FrontendUrl)"
          for value in "$api_url" "$user_pool_id" "$user_pool_client_id" "$frontend_bucket" "$frontend_url"; do
            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "::error::A required CloudFormation output was missing."
              exit 1
            fi
          done
          {
            echo "api_url=${api_url}"
            echo "user_pool_id=${user_pool_id}"
            echo "user_pool_client_id=${user_pool_client_id}"
            echo "frontend_bucket=${frontend_bucket}"
            echo "frontend_url=${frontend_url}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure frontend for deployed API
        shell: bash
        env:
          VITE_AWS_REGION: ${{ vars.AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.stack.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.stack.outputs.user_pool_client_id }}
          VITE_API_URL: ${{ steps.stack.outputs.api_url }}
        run: |
          {
            echo "VITE_AWS_REGION=${VITE_AWS_REGION}"
            echo "VITE_COGNITO_USER_POOL_ID=${VITE_COGNITO_USER_POOL_ID}"
            echo "VITE_COGNITO_CLIENT_ID=${VITE_COGNITO_CLIENT_ID}"
            echo "VITE_API_URL=${VITE_API_URL}"
          } > .env.production

      - name: Build production frontend
        run: npm run build

      - name: Upload frontend to S3 website bucket
        shell: bash
        env:
          FRONTEND_BUCKET: ${{ steps.stack.outputs.frontend_bucket }}
        run: |
          aws s3 sync frontend/dist \
            "s3://${FRONTEND_BUCKET}" \
            --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --region "${AWS_REGION}"
          aws s3 cp frontend/dist/index.html \
            "s3://${FRONTEND_BUCKET}/index.html" \
            --cache-control 'no-cache' \
            --content-type 'text/html' \
            --region "${AWS_REGION}"

      - name: Report deployment success
        if: success()
        env:
          FRONTEND_URL: ${{ steps.stack.outputs.frontend_url }}
          API_URL: ${{ steps.stack.outputs.api_url }}
        run: |
          {
            echo "## SmartQueue deployment succeeded"
            echo
            echo "- Website: ${FRONTEND_URL}"
            echo "- API: ${API_URL}"
            echo "- Stack: ${AWS_STACK_NAME}"
            echo "- Region: ${AWS_REGION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment failure
        if: failure()
        run: |
          {
            echo "## SmartQueue deployment failed"
            echo
            echo "Review the failed step logs. No success is reported unless stack deployment and frontend upload both complete."
          } >> "$GITHUB_STEP_SUMMARY"
