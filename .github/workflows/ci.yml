name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          python -m pip install --disable-pip-version-check PyYAML

      - name: Validate repository configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          class CloudFormationLoader(yaml.SafeLoader):
              pass

          def intrinsic(loader, suffix, node):
              if isinstance(node, yaml.ScalarNode):
                  value = loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode):
                  value = loader.construct_sequence(node, deep=True)
              else:
                  value = loader.construct_mapping(node, deep=True)
              return {"Ref": value} if suffix == "Ref" else {f"Fn::{suffix}": value}

          CloudFormationLoader.add_multi_constructor("!", intrinsic)

          for workflow in (Path(".github/workflows/ci.yml"), Path(".github/workflows/deploy.yml")):
              assert yaml.safe_load(workflow.read_text(encoding="utf-8")), f"Invalid workflow: {workflow}"

          template = yaml.load(
              Path("infrastructure/template.yaml").read_text(encoding="utf-8"),
              Loader=CloudFormationLoader,
          )
          assert template["Transform"] == "AWS::Serverless-2016-10-31"
          assert template["Resources"]

          for manifest, lockfile in (
              (Path("package.json"), Path("package-lock.json")),
              (Path("backend/package.json"), Path("backend/package-lock.json")),
          ):
              package = json.loads(manifest.read_text(encoding="utf-8"))
              lock = json.loads(lockfile.read_text(encoding="utf-8"))
              assert lock["packages"][""]["dependencies"] == package.get("dependencies", {})
              assert lock["packages"][""]["devDependencies"] == package.get("devDependencies", {})

          assert Path(".gitignore").is_file()
          print("Workflow YAML, SAM template, package manifests, lockfiles, and .gitignore are present.")
          PY

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Validate SAM template
        run: sam validate --lint --template-file infrastructure/template.yaml

      - name: Build frontend
        run: npm run build

      - name: Run available frontend tests
        run: npm run test --if-present

      - name: Check backend syntax
        run: |
          node --check backend/src/index.mjs
          node --check backend/src/worker.mjs
          node --check backend/src/reminders.mjs

      - name: Run backend tests
        run: npm run test:backend
